# Attempt to lint & build the action.
# We *separately* rebuild the action, this build is used as a status check.
name: Test
on:
  pull_request:
  schedule:
    # Scheduled build so failures are noticed quicker.
    - cron: '17 4 * * 2,5'

permissions: {}

jobs:
  # Lint & build
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      with:
        fetch-depth: 1
    - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # master
    - name: Install Dependencies
      run: npm ci --ignore-scripts
    - name: Lint
      run: npm run format-check
    - name: Build
      run: npm run build
